<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Rider</title>
    <link rel="stylesheet" href="./style.css">

    <meta name="description" content="Simple Bike Game">
    <link rel="icon" type="image/png" href="./images/icon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./images/icon.png">
</head>

<body>
    <div id="wrapper">
        <div>
            ランキングが1日で変わるようになっていたので、作り直しました。<br>
            新しいURLは<a href="https://fai227.github.io/bike-rider">https://fai227.github.io/bike-rider</a>です。<br>
            このページは1週間ぐらいしたら消すので、移動お願いします。
        </div>
        <div id="titleText" class="bigFont bigMargin">
            - BIKE RIDER -
        </div>
        <div>
            <input type="text" placeholder="Player Name" maxlength="10" id="nameInput" class="normalFont pencilBorder">
        </div>
        <div>
            <button id="startButton" onclick="GameStart()" class="normalFont pencilBorder">Start Game</button>
        </div>
        <div onclick="ChangeVolume()">
            <img src=" ./images/speaker0.png" alt="./images/speaker0.png" id="volumeImage">
        </div>
        <hr class="pencilBorder" id="hr">
        <div>
            <div class="normalFont" id="rankingText">Ranking</div>
            <table class="smallFont">
                <tr>
                    <td>Loading Ranking...</td>
                </tr>
            </table>
        </div>
    </div>
    <canvas id="canvas" class="pencilBorder" style="display: none; opacity: 0;"></canvas>
</body>

<script defer src="./script.js"></script>

</html>
